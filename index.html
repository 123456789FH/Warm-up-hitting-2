:root{--ink:#133f34;--green:#205741;--pine:#173f34;--cream:#fffcf2;--paper:#f5f1df;--lime:#e0ea9a;--line:#d4d7bd;--red:#9c402e;--gold:#f5be5b}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Garden,'Tahoma',sans-serif;background:#eaeadd;line-height:1.65}body,button,input,select{font-family:Garden,'Tahoma',sans-serif}button,select{font-size:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default}button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:4px solid #f19927;outline-offset:3px}
.wrap{max-width:1510px;margin:auto;padding:0 clamp(12px,3.7vw,65px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0}header .brand,header .tools,.nav,.credits,.hrow,.choices,.tabbar,.pillrow{display:flex;align-items:center;gap:10px}.brand-logo{width:53px;height:53px;border-radius:50%;box-shadow:0 0 0 1px #bdc7aa;background:white}.brand strong{display:block;font:700 17px Kufi}.brand small{font-size:13px}.tools button,.nav button,.tertiary{background:var(--cream);border:1px solid #bdc9b5;border-radius:11px;min-height:40px;padding:5px 14px;font-weight:bold}.tools .ic{font-family:Arial,sans-serif;font-size:19px;vertical-align:middle;margin-left:4px}
.board{border:1px solid #bac7af;border-radius:25px;overflow:hidden;background:var(--cream);box-shadow:0 12px 40px #2c4b3714}.screen{min-height:560px}.cover{background:var(--pine);color:#fffaf0;display:grid;grid-template-columns:1fr 1fr;position:relative;min-height:clamp(445px,65vh,690px);isolation:isolate}.cover .story{padding:clamp(24px,4.2vw,70px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;z-index:1}.eyeline{font:700 clamp(13px,1.1vw,17px) Kufi;letter-spacing:0;display:flex;gap:9px;align-items:center;color:#426347}.eyeline:before{content:'';height:3px;width:27px;background:#9caa61;border-radius:4px}.cover .eyeline{color:var(--lime)}h1,h2,h3{font-family:Kufi,Garden,sans-serif;line-height:1.5;margin:0}h1{font-size:clamp(44px,5.95vw,93px);margin:16px 0 14px;line-height:1.48}.lime{color:var(--lime)}.cover p{font-size:clamp(18px,1.62vw,27px);margin:0 0 22px;max-width:530px}.cover-visual{min-height:100%;position:relative;overflow:hidden}.cover-visual img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.primary{background:var(--lime);color:#213d2c;border:0;border-radius:13px;min-height:49px;padding:8px 24px;font:700 17px Kufi}.cover .primary{box-shadow:0 4px 0 #879944}.primary.dark{background:var(--pine);color:white;box-shadow:0 3px 0 #0c2b21}.arrow{font-family:Arial,sans-serif;margin-right:9px}
.lesson{display:grid;grid-template-columns:0.95fr 1.12fr;min-height:clamp(465px,66vh,740px)}.lesson .copy{padding:clamp(22px,3vw,50px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:16px}.lesson h2{font-size:clamp(29px,3.25vw,52px);line-height:1.55;max-width:100%}.prompt{font-size:clamp(19px,1.7vw,28px);line-height:1.7;margin:0}.visual{padding:clamp(16px,2.1vw,32px);background:#e8ecd2;display:flex;align-items:center;justify-content:center;min-width:0;position:relative;flex-direction:column;gap:15px;overflow:hidden}.visual.gold{background:#f5e5bd}.visual.rose{background:#f4dfd5}.visual.blue{background:#deece6}.visual.forest{background:#234b38;color:#fff9e5}.visual-frame{width:100%;max-width:750px;text-align:center}.visual-caption{font:700 clamp(13px,1.28vw,21px) Kufi;color:inherit;text-align:center;margin:8px 0}.scene-photo{width:100%;display:block;max-height:325px;object-fit:cover;border-radius:17px}.choices{gap:8px;flex-wrap:wrap}.choice{font:700 clamp(16px,1.45vw,23px) Kufi;border:1.5px solid #879c80;background:white;border-radius:11px;padding:6px 17px;min-width:66px;min-height:46px;box-shadow:0 3px 0 #c7d2b4}.choice:hover{background:#edf2dc}.choice.won{background:#d9e98f;border-color:#597349}.choice.miss{background:#f8e1cc;border-color:#be8057}.feedback{font-size:clamp(15px,1.18vw,19px);padding:8px 13px;border-right:4px solid #a2af75;background:#f1f2df;border-radius:5px;min-height:34px;line-height:1.65;width:100%}.feedback:empty{display:none}.feedback.ok{border-color:#528351;background:#e5efdc}.feedback.no{border-color:#d09958;background:#fcf0d8}.mini{font-size:clamp(14px,1.1vw,17px);color:#47654b;margin:0}.visual .mini{color:inherit;text-align:center}.tabbar{gap:6px;flex-wrap:wrap}.round{border:1px solid #9aa991;border-radius:50%;background:transparent;width:33px;height:33px;line-height:1;padding:0}.round.active{background:var(--pine);color:white}.round.done:not(.active){background:#dcecb8}

function getQ(){
 if(modes[page])return modes[page];
 if(page===3){const j=rounds[3],[r,c]=readArrays[j],ops=[[10,24,20],[6,7,5],[8,12,15],[9,14,16]][j];return {options:ops,a:ops.indexOf(r*c),ex:'عدد الصفوف في عدد المربعات في كل صفّ يعطينا '+eq(r,'×',c,'=',r*c)+'.',hint:'عدّوا الصفوف، ثم المربعات في صفّ واحد.'}}
 if(page===9){const j=rounds[9],s=patterns[j],wrong=[[40,45],[24,27],[50,60],[10,0]][j],wrong2=[[31,32],[19,20],[42,43],[40,50]][j];
 const ops=j%2?[wrong2,wrong,s.slice(4)]:[wrong,s.slice(4),wrong2];return {options:ops.map(pair=>eq(pair[0],'،',pair[1])),a:j%2?2:1,ex:rules[j]+' العددان التاليان هما '+ar(s[4])+' ثم '+ar(s[5])+'.',hint:'ما مقدار التغيّر بين كل عدد والعدد الذي يليه؟'}}
 if(page===13)return exitQs[rounds[13]];
}
function picture(isB){const icon=(id,original,changed)=>isB?'<button class="'+(found.has(id)?'found':'')+'" data-spot="'+id+'" aria-label="'+(id===0?'الحشرة':id===1?'الطقس':'موضع الشتلة')+'">'+changed+'</button>':'<span>'+original+'</span>';
 const cells=fill(12,i=>isB?'<button data-spot="'+(i===6?2:-1)+'" class="'+(i===6&&found.has(2)?'found':'')+'" aria-label="الموضع '+ar(i+1)+'">'+(i===6?'🟤':'🌱')+'</button>':'<span>🌱</span>');

function tell(msg,tone){marks[key()]={text:msg,tone};let el=$('fb');if(el){el.innerHTML=msg;el.className='feedback '+tone}}
function shine(buttonEl){if(!buttonEl||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const box=buttonEl.getBoundingClientRect();for(let i=0;i<8;i++){let s=document.createElement('span');s.className='spark';s.textContent='★';s.setAttribute('aria-hidden','true');s.style.left=(box.left+box.width/2)+'px';s.style.top=(box.top+box.height/2)+'px';s.style.setProperty('--dx',Math.cos(i*Math.PI/4)*75+'px');s.style.setProperty('--dy',(Math.sin(i*Math.PI/4)*60-30)+'px');document.body.append(s);setTimeout(()=>s.remove(),900)}}
function chime(){if(!soundOn||!ctx)return;[587.3,740,880].forEach((frequency,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.09;o.type='sine';o.frequency.value=frequency;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.09,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.3)})}
function win(el){if(wins.has(key()))return;wins.add(key());shine(el);chime();$('starcount').textContent='★ '+ar(wins.size)}
function gotoPage(i){page=Math.min(titles.length-1,Math.max(i,0));render();$('screen').focus({preventScroll:true});window.scrollTo(0,0)}
function openMap(){let list=$('mapgrid');list.innerHTML=titles.map((t,i)=>'<button data-jump="'+i+'" class="'+(page===i?'current':'')+'"><b>'+ar(i+1)+'</b>'+t+'</button>').join('');$('map').showModal()}
function choose(answer,el){let q=getQ();if(!q||wins.has(key()))return;if(answer===q.a){answers[key()]=answer;win(el);tell(q.ex,'ok');render()}else{el.classList.add('miss');tell(q.hint+' جرّبوا مرة أخرى.','no')}}
function action(name,el){if(name==='start')gotoPage(1);
 if(name==='map')openMap();
 if(name==='rotate'){flipped=!flipped;win(el);tell('تبادل عدد الصفوف وعدد الشتلات في الصفّ، وبقيت ١٢ شتلة. هذه هي الخاصية الإبدالية.','ok');render()}
 if(name==='design'){let n=rows*cols,id=rows+'x'+cols;if(n!==24){tell('تصميمكم يتّسع لـ '+ar(n)+' شتلة. '+(n<24?'عدد المواضع التي نحتاج إلى إضافتها هو '+ar(24-n)+'.':'عدد المواضع الزائدة هو '+ar(n-24)+'.')+' جرّبوا تغيير أحد العاملين.','no');return}if(designs.has(id)){tell('وجدتم هذا التصميم من قبل. غيّروا عدد الصفوف وابحثوا عن تصميم آخر.','');return}designs.add(id);if(designs.size===1){tell('يتّسع تصميمكم لـ ٢٤ شتلة! جرّبوا ترتيبًا ثانيًا.','ok')}else{win(el);tell('نجح التصميمان! ما الذي تغيّر بينهما؟ وما الذي بقي ثابتًا؟','ok')}render()}}
$('screen').addEventListener('click',ev=>{let el=ev.target.closest('button');if(!el)return;let d=el.dataset;if(d.action)action(d.action,el);else if(d.answer!==undefined)choose(+d.answer,el);else if(d.round!==undefined){rounds[page]=+d.round;render()}else if(d.cell){let [r,c]=d.cell.split(',').map(Number),[nr,nc]=buildArrays[rounds[4]];if(wins.has(key()))return;attempts[key()]=[r,c];if(r===nr&&c===nc){win(el);tell('بنيتم الشبكة المطلوبة! '+eq(r,'×',c,'=',r*c)+' مربعًا.','ok')}else tell('عدد الصفوف في اختياركم '+ar(r)+'، وعدد الأعمدة '+ar(c)+'. راجعوا العاملين ثم المسوا مربع النهاية من جديد.','no');render()}
else if(d.spot!==undefined){let n=+d.spot;if(found.size===3)return;if(n<0){tell('هذه الشتلة موجودة في الصورتين. افحصوا موضعًا آخر.','no');return}if(found.has(n)){tell('سبق أن اكتشفتم هذا الفرق. ابحثوا عن موضع آخر.','');return}found.add(n);if(found.size===3){win(el);tell('اكتمل اللغز! تغيّرت الحشرة والطقس، واختفت شتلة واحدة. كان العدد ١٢ وأصبح ١١. أيّ صفّ لم يعد كاملًا؟','ok')}else {tell(['اكتشفتم الحشرة المختلفة!','اكتشفتم تغيّر الطقس!','وجدتم موضع الشتلة المفقودة!'][n],'ok');shine(el)}render()}});
$('screen').addEventListener('change',ev=>{if(ev.target.id==='rows'||ev.target.id==='cols'){rows=+$('rows').value;cols=+$('cols').value;delete marks[key()];let id=ev.target.id;render();$(id).focus({preventScroll:true})}});
$('next').onclick=()=>gotoPage(page+1);$('prev').onclick=()=>gotoPage(page-1);$('openmap').onclick=openMap;$('closemap').onclick=()=>$('map').close();$('mapgrid').onclick=e=>{let b=e.target.closest('[data-jump]');if(b){$('map').close();gotoPage(+b.dataset.jump)}};
$('sound').onclick=async()=>{try{if(!soundOn){const A=window.AudioContext||window.webkitAudioContext;ctx=ctx||new A();await ctx.resume()}soundOn=!soundOn;$('sound').setAttribute('aria-pressed',String(soundOn));$('sound').setAttribute('aria-label',soundOn?'كتم الصوت':'تفعيل الصوت');$('sound').lastElementChild.textContent=soundOn?'الصوت مفعّل':'الصوت';if(soundOn)chime()}catch{$('notice').textContent='تعذّر تشغيل الصوت في هذا المتصفح.'}};
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('full').lastElementChild.textContent='استخدموا تكبير المتصفح'}};
document.addEventListener('fullscreenchange',()=>{$('full').lastElementChild.textContent=document.fullscreenElement?'إنهاء ملء الشاشة':'ملء الشاشة'});
document.addEventListener('keydown',ev=>{if($('map').open||ev.altKey||ev.ctrlKey||ev.metaKey||['SELECT','TEXTAREA','INPUT'].includes(ev.target.tagName))return;if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){ev.preventDefault();gotoPage(page+(ev.key==='ArrowLeft'?1:-1))}});
render();
